  <text x="524" y="171" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600">Modular Clean Architecture</text>
  <text x="484" y="202" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">Clear boundaries between UI, services, and persistence keep</text>
  <text x="484" y="222" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">domain logic decoupled, readable, testable, and extensible.</text>
