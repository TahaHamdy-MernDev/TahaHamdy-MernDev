  <text x="64" y="39" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600">Strict Type Safety &amp; Contracts</text>
  <text x="24" y="70" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">End-to-end TypeScript sharing with Zod and class-validator</text>
  <text x="24" y="90" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">enforces runtime validation and clean API contracts.</text>
