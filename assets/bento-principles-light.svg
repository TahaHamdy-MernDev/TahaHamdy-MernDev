  <text x="24" y="202" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">Idempotent webhook handlers, atomic DB transactions, and</text>
  <text x="24" y="222" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">background retry queues protect critical state mutations.</text>
