  <text x="64" y="303" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600">Database &amp; Query Efficiency</text>
  <text x="24" y="334" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">Normalized schemas, strategic indexing, safe Prisma/Drizzle</text>
  <text x="24" y="354" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">migrations, and query profiling prevent N+1 bottlenecks.</text>
