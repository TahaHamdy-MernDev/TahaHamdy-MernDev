  <text x="484" y="70" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">Next.js Server Components, streaming SSR, and smart caching</text>
  <text x="484" y="90" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">keep client bundles lean and Core Web Vitals fast.</text>
