<svg xmlns="http://www.w3.org/2000/svg" width="900" height="212" viewBox="0 0 900 212" fill="none">
  <rect x="0.75" y="0.75" width="440.5" height="96.5" rx="13.25" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5" />
  <text x="24" y="32" fill="#0284c7" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700">01</text>
  <text x="50" y="32" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700">Strict Type Safety &amp; Contracts</text>
  <text x="24" y="57" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">End-to-end TypeScript sharing with Zod and class-validator</text>
  <text x="24" y="76" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">keeps untrusted inputs out of core business logic.</text>
  <rect x="458.75" y="0.75" width="440.5" height="96.5" rx="13.25" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5" />
  <text x="482" y="32" fill="#7c3aed" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700">02</text>
  <text x="508" y="32" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700">Performance &amp; Rendering</text>
  <text x="482" y="57" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">Next.js Server Components, SSR streaming, and caching</text>
  <text x="482" y="76" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">keep client bundles lean and Core Web Vitals fast.</text>
  <rect x="0.75" y="114.75" width="440.5" height="96.5" rx="13.25" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5" />
  <text x="24" y="146" fill="#059669" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700">03</text>
  <text x="50" y="146" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700">Resilient Business Workflows</text>
  <text x="24" y="171" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">Idempotent webhook handlers, atomic DB transactions,</text>
  <text x="24" y="190" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">and safe retry queues protect critical state mutations.</text>
  <rect x="458.75" y="114.75" width="440.5" height="96.5" rx="13.25" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5" />
  <text x="482" y="146" fill="#e11d48" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700">04</text>
  <text x="508" y="146" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700">Modular Architecture</text>
  <text x="482" y="171" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">Clear separation between UI, application services, and</text>
  <text x="482" y="190" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">persistence keeps features testable and maintainable.</text>
