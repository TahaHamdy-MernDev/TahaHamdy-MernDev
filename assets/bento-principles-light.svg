  <text x="524" y="303" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600">Observability &amp; Automated Delivery</text>
  <text x="484" y="334" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">Structured logging, predictable error contracts, Dockerized</text>
