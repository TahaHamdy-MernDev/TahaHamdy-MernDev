  <text x="20" y="294" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">Normalized schemas, strategic indexing, safe Prisma/Drizzle</text>
