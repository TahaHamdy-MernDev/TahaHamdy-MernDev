<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><rect x="0" y="0" width="282" height="190" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1"/><rect x="24" y="24" width="44" height="44" rx="12" fill="#2f81f7"/><text x="46" y="53" text-anchor="middle" font-size="18" font-weight="800" fill="#0d1117">01</text><text x="24" y="108" font-size="19" font-weight="700" fill="#e6edf3">Type-safe by default</text><text x="24" y="138" font-size="14" fill="#8b949e">End-to-end types from DB to UI.</text><rect x="306" y="0" width="282" height="190" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1"/><rect x="330" y="24" width="44" height="44" rx="12" fill="#3fb950"/><text x="352" y="53" text-anchor="middle" font-size="18" font-weight="800" fill="#0d1117">02</text><text x="330" y="108" font-size="19" font-weight="700" fill="#e6edf3">Ship small, ship often</text><text x="330" y="138" font-size="14" fill="#8b949e">Short cycles and CI/CD automation.</text><rect x="612" y="0" width="282" height="190" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1"/><rect x="636" y="24" width="44" height="44" rx="12" fill="#a371f7"/><text x="658" y="53" text-anchor="middle" font-size="18" font-weight="800" fill="#0d1117">03</text><text x="636" y="108" font-size="19" font-weight="700" fill="#e6edf3">Real-time ready</text><text x="636" y="138" font-size="14" fill="#8b949e">Events, sockets and webhooks.</text><rect x="918" y="0" width="282" height="190" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1"/><rect x="942" y="24" width="44" height="44" rx="12" fill="#f0883e"/><text x="964" y="53" text-anchor="middle" font-size="18" font-weight="800" fill="#0d1117">04</text><text x="942" y="108" font-size="19" font-weight="700" fill="#e6edf3">Clean, simple UI</text><text x="942" y="138" font-size="14" fill="#8b949e">Clear, fast, accessible interfaces.</text></svg>