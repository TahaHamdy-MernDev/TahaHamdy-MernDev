<svg xmlns="http://www.w3.org/2000/svg" width="900" height="216" viewBox="0 0 900 216" fill="none">
  <style>
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .a1 { opacity: 0; animation: fadeUp 0.55s ease-out 0.05s forwards; }
    .a2 { opacity: 0; animation: fadeUp 0.55s ease-out 0.16s forwards; }
    .a3 { opacity: 0; animation: fadeUp 0.55s ease-out 0.28s forwards; }
    .a4 { opacity: 0; animation: fadeUp 0.55s ease-out 0.38s forwards; }
    @media (prefers-reduced-motion: reduce) {
      .a1, .a2, .a3, .a4 { opacity: 1; animation: none; }
    }
  </style>

  <!-- Left Flat Identity Card -->
  <rect x="0.5" y="0.5" width="565" height="215" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1" />

  <g class="a1">
    <text x="36" y="60" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.7">Taha Hamdy</text>
    <text x="36" y="90" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500">Full-Stack Software Engineer</text>
  </g>

  <g class="a2">
    <text x="36" y="128" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5">Designing and shipping production SaaS platforms, modular</text>
    <text x="36" y="149" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5">NestJS APIs, and fast Next.js interfaces with TypeScript.</text>
  </g>

  <g class="a3">
    <line x1="36" y1="172" x2="530" y2="172" stroke="#21262d" stroke-width="1" />
    <text x="36" y="195" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5">TypeScript  ·  Next.js  ·  NestJS  ·  PostgreSQL  ·  Prisma  ·  Drizzle</text>
  </g>

  <!-- Right Flat Snapshot Card -->
  <rect x="585.5" y="0.5" width="314" height="215" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1" />
  <text x="612" y="34" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="1.2">SNAPSHOT</text>
  <line x1="612" y1="48" x2="874" y2="48" stroke="#21262d" stroke-width="1" />

  <g class="a2">
    <svg x="612.0" y="62.0" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8b949e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" /><circle cx="12" cy="10" r="3" /></svg>
    <text x="634" y="73" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">LOCATION</text>
    <text x="634" y="92" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500">Cairo, Egypt (UTC+2)</text>
  </g>

  <g class="a3">
    <svg x="612.0" y="114.0" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8b949e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2" /><polyline points="2 12 12 17 22 12" /><polyline points="2 17 12 22 22 17" /></svg>
    <text x="634" y="125" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">FOCUS</text>
    <text x="634" y="144" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500">Multi-Tenant SaaS &amp; Commerce</text>
  </g>

  <g class="a4">
    <svg x="612.0" y="166.0" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8b949e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z" /><path d="m3.3 7 8.7 5 8.7-5" /><path d="M12 22V12" /></svg>
    <text x="634" y="177" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">BUILDING</text>
    <text x="634" y="196" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500">Web Platforms &amp; Dev Tooling</text>
  </g>
</svg>
